[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelrows"
version = "0.1.0"
description = "Pixel art as rows of text: draw sprites and animations, render them to PNG and GIF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pixelrows = "pixelrows.cli:main"

[tool.setuptools.packages.find]
include = ["pixelrows*"]
